[project]
name = "btcx"
version = "0.1.0"
description = "Analysis tools for the btcx-files ARG"
readme = "README.md"
license = "MIT"
authors = [{ name = "aleph" }, { name = "Chris Smith" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/crsmithdev/btcx-tools"
Game = "https://github.com/suebtwist/btcx-files"

[project.scripts]
btcx = "btcx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # a stop-word list reads better as one string split on whitespace

[tool.pytest.ini_options]
testpaths = ["tests"]
